# ============================================================
# CI/CD Pipeline - Frontend Despacho
# Trigger: push a la rama deploy
# Pasos: build imagen → push Docker Hub → deploy en EC2
# ============================================================

name: CI/CD Frontend Despacho

on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build y Push imagen Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy en instancia EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONT_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login a Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Descargar la nueva imagen
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # Detener y eliminar contenedor anterior
            docker stop front-despacho || true
            docker rm front-despacho || true

            # Levantar el nuevo contenedor
            docker run -d \
              --name front-despacho \
              --restart unless-stopped \
              -p 80:80 \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # Verificar que está corriendo
            docker ps | grep front-despacho

            # Limpiar imágenes antiguas
            docker image prune -f
